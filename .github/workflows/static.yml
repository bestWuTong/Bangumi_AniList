# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # 当 update-bangumi 工作流完成后自动触发
  workflow_run:
    workflows: ["Update Bangumi Data"]
    types:
      - completed

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 打包与上传必须单独成一个 job：
  # GitHub 的产物索引是最终一致的，上传(finalize)后立刻查询可能返回 0 个，
  # deploy-pages 会报 "No artifacts named github-pages were found for this workflow run"。
  # 参考 actions/deploy-pages#451。
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 跨 job 本身会隔开几秒，这里再补一段缓冲，给产物索引留出同步时间。
      # 如果 GitHub 修好这个竞态（issue #451），这一段可以删掉。
      - name: Wait for artifact index to settle
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
