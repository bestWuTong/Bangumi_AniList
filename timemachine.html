<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>追番时光机</title>
    <meta name="description" content="把收藏的每一部番剧按播出时间串成一条时间轴。">
    <link rel="icon" id="favicon" href="static/img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/timemachine.css">
</head>
<body>
    <div class="bg-dots" aria-hidden="true"></div>
    <canvas class="petals" id="petals" aria-hidden="true"></canvas>
    <div class="progress-rail" aria-hidden="true"><i id="progress-bar"></i></div>

    <header class="tm-bar">
        <div class="tm-bar-inner">
            <a class="tm-back" href="index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/>
                </svg>
                <span>返回追番列表</span>
            </a>
            <div class="tm-brand">
                <span class="tm-brand-cn">追番时光机</span>
                <span class="tm-brand-en">TIME MACHINE</span>
            </div>
            <div class="tm-actions">
                <button class="tm-action" id="jump-latest" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/>
                    </svg>
                    <span>最新一部</span>
                </button>
                <button class="tm-action tm-action-accent" id="random-jump" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>
                    </svg>
                    <span>随机穿越</span>
                </button>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-sky" aria-hidden="true">
            <span class="hero-rays"></span>
            <span class="blob b1"></span>
            <span class="blob b2"></span>
            <span class="blob b3"></span>
            <span class="cloud c1"><svg viewBox="0 0 160 72" aria-hidden="true"><g fill="currentColor"><circle cx="44" cy="42" r="26"/><circle cx="84" cy="31" r="31"/><circle cx="121" cy="43" r="23"/><rect x="38" y="42" width="86" height="24" rx="12"/></g></svg></span>
            <span class="cloud c2"><svg viewBox="0 0 160 72" aria-hidden="true"><g fill="currentColor"><circle cx="44" cy="42" r="26"/><circle cx="84" cy="31" r="31"/><circle cx="121" cy="43" r="23"/><rect x="38" y="42" width="86" height="24" rx="12"/></g></svg></span>
            <span class="cloud c3"><svg viewBox="0 0 160 72" aria-hidden="true"><g fill="currentColor"><circle cx="44" cy="42" r="26"/><circle cx="84" cy="31" r="31"/><circle cx="121" cy="43" r="23"/><rect x="38" y="42" width="86" height="24" rx="12"/></g></svg></span>
            <span class="cloud c4"><svg viewBox="0 0 160 72" aria-hidden="true"><g fill="currentColor"><circle cx="44" cy="42" r="26"/><circle cx="84" cy="31" r="31"/><circle cx="121" cy="43" r="23"/><rect x="38" y="42" width="86" height="24" rx="12"/></g></svg></span>
            <span class="sparkle k1"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12C7 10 11 6 12 0z"/></svg></span>
            <span class="sparkle k2"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12C7 10 11 6 12 0z"/></svg></span>
            <span class="sparkle k3"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12C7 10 11 6 12 0z"/></svg></span>
            <span class="sparkle k4"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12C7 10 11 6 12 0z"/></svg></span>
            <span class="sparkle k5"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c1 6 5 10 12 12-7 2-11 6-12 12-1-6-5-10-12-12C7 10 11 6 12 0z"/></svg></span>
        </div>
        <div class="hero-main">
            <p class="hero-jp">おもいでの タイムマシン</p>
            <p class="hero-kicker">
                <span class="kicker-line" aria-hidden="true"></span>
                <span id="hero-kicker">ANIME TIME MACHINE</span>
                <span class="kicker-line" aria-hidden="true"></span>
            </p>
            <h1 class="hero-title">
                <span class="t1">追番</span><span class="t2">时光机</span>
            </h1>
            <p class="hero-lead">把收藏的每一部番剧按播出时间串成一条时间轴。</p>
            <div class="hero-figures" id="hero-figures">
                <div class="figure"><b id="fig-total">—</b><span>部已收藏</span></div>
                <div class="figure"><b id="fig-span">—</b><span>年时光</span></div>
                <div class="figure"><b id="fig-years">—</b><span>个年份</span></div>
                <div class="figure"><b id="fig-latest">—</b><span>最近播出</span></div>
            </div>
            <div class="hero-cue">
                <span>向下滚动，启动时光机</span>
                <i aria-hidden="true"></i>
            </div>
        </div>

        <div class="era-panel">
            <div class="era-panel-head">
                <div>
                    <span class="era-panel-title">年代速览</span>
                    <span class="era-panel-sub" id="era-panel-sub">1986 — 2026</span>
                </div>
                <span class="era-panel-hint">点击年份，直接跳过去</span>
            </div>
            <div class="era-bars" id="era-bars"></div>
        </div>
    </section>

    <nav class="decade-rail" id="decade-rail" aria-label="按年代跳转"></nav>

    <main class="timeline-wrap">
        <div class="timeline" id="timeline">
            <div class="tm-loading">正在校准时间坐标…</div>
        </div>
    </main>

    <footer class="tm-footer">
        <p>追番时光机 · 1.0 · 全部番剧按 Bangumi 播出日期排序</p>
        <p class="tm-footer-sub">数据来源 <a href="https://bgm.tv" target="_blank" rel="noopener">Bangumi</a> · 由 <a href="index.html">追番列表</a> 衍生</p>
    </footer>

    <!-- 详情弹窗 -->
    <div class="tm-modal" id="tm-modal" role="dialog" aria-modal="true" aria-labelledby="tm-modal-title" aria-hidden="true">
        <div class="tm-modal-scrim" data-close="1"></div>
        <div class="tm-modal-card">
            <button class="tm-modal-close" id="tm-modal-close" type="button" aria-label="关闭详情">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                    <path d="M18 6L6 18"/><path d="M6 6l12 12"/>
                </svg>
            </button>
            <div class="tm-modal-cover"><img id="tm-modal-img" src="" alt=""></div>
            <div class="tm-modal-info">
                <p class="tm-modal-eyebrow" id="tm-modal-eyebrow"></p>
                <h2 class="tm-modal-title" id="tm-modal-title"></h2>
                <p class="tm-modal-jp" id="tm-modal-jp"></p>
                <div class="tm-modal-stats" id="tm-modal-stats"></div>
                <p class="tm-modal-summary" id="tm-modal-summary"></p>
                <div class="tm-modal-tags" id="tm-modal-tags"></div>
                <a class="tm-modal-link" id="tm-modal-link" href="#" target="_blank" rel="noopener">
                    在 Bangumi 查看
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M7 17L17 7"/><path d="M8 7h9v9"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <noscript>
        <div class="tm-empty">这个页面需要 JavaScript 才能启动时光机。</div>
    </noscript>

    <script src="static/timemachine.js"></script>
</body>
</html>
